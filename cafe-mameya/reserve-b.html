<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喫茶 まめや のご予約｜そら予約</title>
<style>
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#eef4f8;color:#24333d}
  .bar{background:#2e6da4;color:#fff;padding:12px 20px;font-weight:700;letter-spacing:.06em}
  .card{max-width:640px;margin:28px auto;background:#fff;border-radius:12px;padding:26px 28px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#5a6d78;font-size:13.5px;margin:0 0 18px}
  dl{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:0 0 20px}
  dt{font-weight:700;color:#5a6d78}dd{margin:0}
  label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 5px}
  input,select{width:100%;padding:10px;border:1px solid #c4d2da;border-radius:8px;font:inherit}
  .btn{margin-top:22px;width:100%;background:#2e6da4;color:#fff;border:none;padding:13px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
  .note{font-size:12px;color:#7b8b94;margin-top:14px}
</style>
</head>
<body>
<div class="bar">そら予約</div>
<div class="card">
  <h1>喫茶 まめや</h1>
  <p class="sub">宮城県仙台市青葉区一番町2-3-8 まめやビル1F</p>
  <dl>
    <dt>営業時間</dt><dd>11:00〜18:00（ラストオーダー 17:30）</dd>
    <dt>定休日</dt><dd>火曜日</dd>
    <dt>電話</dt><dd>022-555-0134</dd>
  </dl>
  <label>ご希望日</label>
  <input type="date">
  <label>ご希望時間</label>
  <select><option>11:30</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select>
  <label>人数</label>
  <select><option>1名</option><option>2名</option><option>3名</option><option>4名</option><option>5名</option></select>
  <button class="btn">空き状況を確認する</button>
  <p class="note">※ これは予約リクエストです。お店からの確認連絡をもって予約が確定します。</p>
</div>
</body>
</html>
