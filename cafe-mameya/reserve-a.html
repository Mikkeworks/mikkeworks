<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喫茶 まめや（一番町）｜たべナビ</title>
<style>
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN",sans-serif;background:#fdf3e7;color:#3d2c1c}
  .bar{background:#e07b39;color:#fff;padding:12px 20px;font-weight:700;letter-spacing:.06em}
  .card{max-width:640px;margin:28px auto;background:#fff;border-radius:12px;padding:26px 28px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .stars{color:#e07b39;font-size:14px;margin:0 0 14px}
  dl{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:14px;margin:0 0 20px}
  dt{font-weight:700;color:#8a6a4d}dd{margin:0}
  label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 5px}
  input,select{width:100%;padding:10px;border:1px solid #e3cdb2;border-radius:8px;font:inherit}
  .btn{margin-top:22px;width:100%;background:#e07b39;color:#fff;border:none;padding:13px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
  .note{font-size:12px;color:#a08768;margin-top:14px}
</style>
</head>
<body>
<div class="bar">たべナビ</div>
<div class="card">
  <h1>喫茶 まめや</h1>
  <p class="stars">★ 4.2（口コミ 87件）｜喫茶店｜仙台・一番町</p>
  <dl>
    <dt>住所</dt><dd>宮城県仙台市青葉区一番町2-3-8</dd>
    <dt>営業時間</dt><dd>12:00〜18:00</dd>
    <dt>定休日</dt><dd>水曜日</dd>
    <dt>電話</dt><dd>022-555-0143</dd>
  </dl>
  <label>ご希望日</label>
  <input type="date">
  <label>ご希望時間</label>
  <select><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select>
  <label>人数</label>
  <select><option>1名</option><option>2名</option><option>3名</option><option>4名</option></select>
  <button class="btn">この内容で予約する</button>
  <p class="note">たべナビからのご予約は即時確定です。</p>
</div>
</body>
</html>
